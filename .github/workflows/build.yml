          package com.khoamt5.app

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent

          /**
           * Nghe sự kiện đổi cửa sổ. Chỉ phản ứng khi app vừa hiện lên nằm trong danh sách
           * app bị khóa và đang trong thời gian khóa: đẩy về màn hình chính.
           * Không đọc nội dung màn hình (canRetrieveWindowContent = false).
           */
          class LockService : AccessibilityService() {

              private var lastLaunch = 0L
              private var lastHome = 0L
          
              companion object {
                  @Volatile
                  var instance: LockService? = null
          
                  // Thông tin chẩn đoán, hiện ở cuối màn hình chính.
                  @Volatile
                  var events = 0
          
                  @Volatile
                  var lastPkg = "(chưa có)"
          
                  @Volatile
                  var lastNote = ""
              }
          
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }
          
              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }
          
              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }
              private val protectedPkgs by lazy { LockStore.protectedPackages(this) }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                      event.eventType != AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED
                  ) return
                  val pkg = event.packageName?.toString() ?: return
                  val isState = event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED
                  if (isState) {
                      events++
                      lastPkg = pkg
                  }
                  if (pkg !in LockStore.lockedPackages(this)) {
                      if (isState) lastNote = "không nằm trong danh sách khóa"
                      return
                  }
                  if (pkg in protectedPkgs) {
                      if (isState) lastNote = "app được miễn khóa"
                      return
                  }
                  if (LockStore.remainingMs(this) <= 0L) {
                      if (isState) lastNote = "đang không khóa"
                      return
                  }
                  lastNote = "ĐÃ CHẶN"

                  // Bước chắc chắn: đẩy app ra màn hình chính.
                  val t = SystemClock.elapsedRealtime()
                  if (t - lastHome > 400L) {
                      lastHome = t
                      performGlobalAction(GLOBAL_ACTION_HOME)
                  }

                  // Thêm: mở màn hình đếm ngược của app (có thể bị hệ thống chặn, không sao).
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastLaunch > 1000L) {
                      lastLaunch = now
                      try {
                          val intent = Intent(this, MainActivity::class.java)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          startActivity(intent)
                      } catch (_: Exception) {
                      }
                  }
              }

              override fun onInterrupt() {}
          }
          KHOAEOF
          mkdir -p app/src/main/java/com/khoamt5/app
          cat > app/src/main/java/com/khoamt5/app/MainActivity.kt <<'KHOAEOF'
          package com.khoamt5.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val handler = Handler(Looper.getMainLooper())

              private val cBg = Color.parseColor("#0F1318")
              private val cCard = Color.parseColor("#1A2029")
              private val cChip = Color.parseColor("#2A3340")
              private val cGray = Color.parseColor("#8B96A5")
              private val cRed = Color.parseColor("#E5484D")
              private val cGreen = Color.parseColor("#30A46C")
              private val cBlue = Color.parseColor("#7FB2FF")
              private val cAmber = Color.parseColor("#F5A524")
              private val cWarnBg = Color.parseColor("#2B2214")

              private lateinit var statusPill: TextView
              private lateinit var caption: TextView
              private lateinit var countdown: TextView
              private lateinit var durationRow: LinearLayout
              private lateinit var durationLabel: TextView
              private lateinit var minusBtn: TextView
              private lateinit var plusBtn: TextView
              private lateinit var appsText: TextView
              private lateinit var selectBtn: TextView
              private lateinit var lockBtn: TextView
              private lateinit var hint: TextView
              private lateinit var setupCard: LinearLayout
              private lateinit var permBtn: TextView
              private lateinit var infoBtn: TextView
              private lateinit var debug: TextView

              private var summary: String = ""
              private var selectCount: Int = 0

              private val tick = object : Runnable {
                  override fun run() {
                      refresh()
                      handler.postDelayed(this, 500L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = cBg
                  window.navigationBarColor = cBg
                  buildUi()
              }

              override fun onResume() {
                  super.onResume()
                  updateSummary()
                  handler.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(tick)
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun bg(color: Int, radiusDp: Int = 0, oval: Boolean = false): GradientDrawable {
                  val d = GradientDrawable()
                  if (oval) d.shape = GradientDrawable.OVAL else d.cornerRadius = dp(radiusDp).toFloat()
                  d.setColor(color)
                  return d
              }

              private fun tv(text: String, size: Float, color: Int, bold: Boolean = false): TextView =
                  TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(typeface, Typeface.BOLD)
                  }

              private fun pillButton(text: String, fill: Int, textColor: Int, heightDp: Int): TextView =
                  tv(text, 16f, textColor, true).apply {
                      gravity = Gravity.CENTER
                      background = bg(fill, heightDp / 2)
                      isClickable = true
                      minimumHeight = dp(heightDp)
                      setPadding(dp(20), 0, dp(20), 0)
                  }

              private fun roundButton(text: String): TextView =
                  tv(text, 26f, Color.WHITE, true).apply {
                      gravity = Gravity.CENTER
                      background = bg(cChip, 0, true)
                      isClickable = true
                  }

              private fun card(fill: Int): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  background = bg(fill, 24)
                  setPadding(dp(20), dp(20), dp(20), dp(20))
              }

              private fun lp(top: Int, h: Int = LinearLayout.LayoutParams.WRAP_CONTENT) =
                  LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, h)
                      .apply { topMargin = dp(top) }

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(28), dp(20), dp(28))
                      setBackgroundColor(cBg)
                  }

                  // Đầu trang: tên app + nhãn trạng thái
                  statusPill = tv("", 12f, Color.WHITE, true).apply {
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(6), dp(12), dp(6))
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(
                          tv("Block", 30f, Color.WHITE, true),
                          LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      )
                      addView(
                          statusPill,
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                      )
                  }
                  root.addView(header, lp(0))

                  // Thẻ đồng hồ
                  caption = tv("", 12f, cGray, true).apply {
                      gravity = Gravity.CENTER
                      letterSpacing = 0.1f
                  }
                  countdown = tv("", 56f, Color.WHITE).apply {
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                      fontFeatureSettings = "tnum"
                      gravity = Gravity.CENTER
                  }
                  minusBtn = roundButton("−").apply { setOnClickListener { changeDuration(-1) } }
                  plusBtn = roundButton("+").apply { setOnClickListener { changeDuration(+1) } }
                  durationLabel = tv("", 18f, Color.WHITE, true).apply { gravity = Gravity.CENTER }
                  durationRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(minusBtn, LinearLayout.LayoutParams(dp(52), dp(52)))
                      addView(
                          durationLabel,
                          LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      )
                      addView(plusBtn, LinearLayout.LayoutParams(dp(52), dp(52)))
                  }
                  val timerCard = card(cCard)
                  timerCard.addView(caption, lp(0))
                  timerCard.addView(countdown, lp(4))
                  timerCard.addView(durationRow, lp(16))
                  root.addView(timerCard, lp(24))

                  // Thẻ app bị khóa
                  appsText = tv("", 17f, Color.WHITE, true)
                  selectBtn = pillButton("", cChip, cBlue, 48).apply {
                      textSize = 15f
                      setOnClickListener { showPicker() }
                  }
                  val appsCard = card(cCard)
                  appsCard.addView(
                      tv("APP BỊ KHÓA", 12f, cGray, true).apply { letterSpacing = 0.1f },
                      lp(0)
                  )
                  appsCard.addView(appsText, lp(8))
                  appsCard.addView(selectBtn, lp(14, dp(48)))
                  root.addView(appsCard, lp(14))

                  // Nút khóa
                  lockBtn = pillButton("", cRed, Color.WHITE, 64).apply {
                      textSize = 18f
                      setOnClickListener { onLockClicked() }
                  }
                  root.addView(lockBtn, lp(20, dp(64)))

                  hint = tv("", 13f, cGray).apply { gravity = Gravity.CENTER }
                  root.addView(hint, lp(14))

                  // Thẻ hướng dẫn bật quyền (chỉ hiện khi chưa bật)
                  permBtn = pillButton("Bật quyền Trợ năng", cAmber, Color.parseColor("#1A1306"), 48).apply {
                      textSize = 15f
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  infoBtn = pillButton("Công tắc bị mờ? Mở thông tin ứng dụng", cChip, Color.WHITE, 44).apply {
                      textSize = 13f
                      setOnClickListener {
                          startActivity(
                              Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                                  .setData(Uri.parse("package:$packageName"))
                          )
                      }
                  }
                  setupCard = card(cWarnBg)
                  setupCard.addView(tv("Cần bật quyền Trợ năng", 16f, cAmber, true), lp(0))
                  setupCard.addView(
                      tv(
                          "Block cần quyền này để biết khi bạn mở app bị khóa. Không đọc nội dung màn hình, không thu thập dữ liệu. " +
                              "Nếu công tắc bị mờ: Thông tin ứng dụng → bật \"Cho phép cài đặt giới hạn\" (hoặc dấu ⋮ → Cho phép cài đặt bị hạn chế).",
                          13f, cGray
                      ),
                      lp(6)
                  )
                  setupCard.addView(permBtn, lp(14, dp(48)))
                  setupCard.addView(infoBtn, lp(8, dp(44)))
                  root.addView(setupCard, lp(14))
          
                  debug = tv("", 11f, cGray).apply { gravity = Gravity.CENTER }
                  root.addView(debug, lp(20))

                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(cBg)
                      addView(
                          root,
                          FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.WRAP_CONTENT
                          )
                      )
                  }
                  setContentView(scroll)
              }

              private fun appLabel(pkg: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
              } catch (_: Exception) {
                  pkg
              }

              /** Tính lại chuỗi tóm tắt app đã chọn (không làm mỗi 500ms cho nhẹ). */
              private fun updateSummary() {
                  val names = LockStore.lockedPackages(this).map { appLabel(it) }.sorted()
                  selectCount = names.size
                  summary = when {
                      names.isEmpty() -> "Chưa chọn app nào"
                      names.size <= 3 -> names.joinToString(", ")
                      else -> names.take(3).joinToString(", ") + " và ${names.size - 3} app khác"
                  }
              }

              private fun showPicker() {
                  if (LockStore.remainingMs(this) > 0L) return
                  val pm = packageManager
                  val protectedPkgs = LockStore.protectedPackages(this)
                  val current = LockStore.lockedPackages(this)

                  val launcherIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(launcherIntent, 0)
                      .map { it.activityInfo.packageName to it.loadLabel(pm).toString() }
                      .distinctBy { it.first }
                      .filter { it.first !in protectedPkgs }
                      .sortedWith(
                          compareByDescending<Pair<String, String>> { it.first in current }
                              .thenBy { it.second.lowercase() }
                      )

                  if (apps.isEmpty()) {
                      Toast.makeText(this, "Không tìm thấy app nào để chọn", Toast.LENGTH_LONG).show()
                      return
                  }

                  val labels = apps.map { it.second }.toTypedArray<CharSequence>()
                  val checked = BooleanArray(apps.size) { apps[it].first in current }
                  val chosen = current.toMutableSet()
                  val inList = apps.map { it.first }.toSet()

                  AlertDialog.Builder(this)
                      .setTitle("Chọn app cần khóa")
                      .setMultiChoiceItems(labels, checked) { _, which, isChecked ->
                          val p = apps[which].first
                          if (isChecked) chosen.add(p) else chosen.remove(p)
                      }
                      .setPositiveButton("Lưu") { _, _ ->
                          LockStore.setLockedPackages(this, chosen.filter { it in inList }.toSet())
                          updateSummary()
                          refresh()
                      }
                      .setNegativeButton("Hủy", null)
                      .show()
              }

              private fun changeDuration(delta: Int) {
                  if (LockStore.remainingMs(this) > 0L) return
                  LockStore.setSelectedIndex(this, LockStore.selectedIndex(this) + delta)
                  refresh()
              }

              private fun onLockClicked() {
                  if (!isServiceEnabled()) {
                      Toast.makeText(this, "Hãy bật quyền Trợ năng cho Block trước", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  if (selectCount == 0) {
                      Toast.makeText(this, "Hãy chọn ít nhất 1 app cần khóa", Toast.LENGTH_LONG).show()
                      return
                  }
                  val minutes = LockStore.STEPS_MIN[LockStore.selectedIndex(this)]
                  if (minutes >= 60L) {
                      // Khóa dài thì hỏi lại một lần cho khỏi bấm nhầm.
                      AlertDialog.Builder(this)
                          .setTitle("Khóa ${LockStore.label(minutes)}?")
                          .setMessage(
                              "App bị khóa: $summary.\n\n" +
                                  "Bắt đầu rồi thì không dừng được cho tới khi hết giờ. " +
                                  "Lệnh MT5 đang mở vẫn chạy, hãy chắc chắn đã đặt SL."
                          )
                          .setPositiveButton("Khóa") { _, _ -> doLock(minutes) }
                          .setNegativeButton("Hủy", null)
                          .show()
                  } else {
                      doLock(minutes)
                  }
              }

              private fun doLock(minutes: Long) {
                  LockStore.start(this, minutes)
                  refresh()
              }

              private fun formatMs(ms: Long): String {
                  val s = (ms + 999L) / 1000L
                  val h = s / 3600L
                  val m = (s % 3600L) / 60L
                  val sec = s % 60L
                  return if (h > 0L) String.format("%d:%02d:%02d", h, m, sec)
                  else String.format("%02d:%02d", m, sec)
              }

              private fun setPill(text: String, fill: Int, textColor: Int) {
                  statusPill.text = text
                  statusPill.setTextColor(textColor)
                  statusPill.background = bg(fill, 16)
              }

              private fun refresh() {
                  val remaining = LockStore.remainingMs(this)
                  val enabled = isServiceEnabled()

                  setupCard.visibility = if (enabled) View.GONE else View.VISIBLE
                  val running = if (LockService.instance != null) "đang chạy" else "KHÔNG chạy"
                  debug.text = "Chẩn đoán: dịch vụ $running, nhận ${LockService.events} sự kiện\n" +
                      "App mở gần nhất: ${LockService.lastPkg} → ${LockService.lastNote}"
                  appsText.text = summary

                  if (remaining > 0L) {
                      setPill("ĐANG KHÓA", cRed, Color.WHITE)
                      caption.text = "CÒN LẠI"
                      countdown.text = formatMs(remaining)
                      selectBtn.visibility = View.GONE
                      durationRow.visibility = View.GONE
                      lockBtn.isEnabled = false
                      lockBtn.text = "Đang khóa…"
                      lockBtn.setTextColor(cGray)
                      lockBtn.background = bg(cChip, 32)
                      hint.text = "Hết giờ sẽ tự mở khóa. Không có nút dừng."
                  } else {
                      val idx = LockStore.selectedIndex(this)
                      val minutes = LockStore.STEPS_MIN[idx]
                      if (enabled) setPill("SẴN SÀNG", cGreen, Color.WHITE)
                      else setPill("CHƯA BẬT TRỢ NĂNG", cChip, cAmber)
                      caption.text = "THỜI GIAN KHÓA"
                      countdown.text = formatMs(minutes * 60_000L)
                      selectBtn.visibility = View.VISIBLE
                      selectBtn.text = "Chọn app cần khóa ($selectCount)"
                      durationRow.visibility = View.VISIBLE
                      durationLabel.text = LockStore.label(minutes)
                      minusBtn.isEnabled = idx > 0
                      minusBtn.alpha = if (idx > 0) 1f else 0.35f
                      plusBtn.isEnabled = idx < LockStore.STEPS_MIN.size - 1
                      plusBtn.alpha = if (idx < LockStore.STEPS_MIN.size - 1) 1f else 0.35f
                      lockBtn.isEnabled = true
                      lockBtn.text = "KHÓA ${LockStore.label(minutes).uppercase()}"
                      lockBtn.setTextColor(Color.WHITE)
                      lockBtn.background = bg(cRed, 32)
                      hint.text = if (enabled && LockService.instance == null) {
                          "Dịch vụ Trợ năng chưa chạy. Vào Cài đặt → Trợ năng, tắt rồi bật lại công tắc Block."
                      } else if (enabled) {
                          "Chọn app và thời gian, rồi bấm khóa. Lệnh MT5 đang mở vẫn chạy, nhớ đặt SL."
                      } else {
                          "Bật quyền Trợ năng ở thẻ bên dưới thì Block mới chặn được."
                      }
                  }
              }

              private fun isServiceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val cn = ComponentName(this, LockService::class.java)
                  val full = cn.flattenToString()
                  val short = cn.flattenToShortString()
                  return enabled.split(':').any { it.equals(full, true) || it.equals(short, true) }
              }
          }
          KHOAEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KhoaMT5-apk
          path: app/build/outputs/apk/debug/app-debug.apk
