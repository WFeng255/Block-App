              val BORDER = Color.parseColor("#E6E8EC")
              val TEXT = Color.parseColor("#12161C")
              val MUTED = Color.parseColor("#6B7280")
              val ACCENT = Color.parseColor("#E5484D")
              val OK = Color.parseColor("#16A34A")
              val WARN = Color.parseColor("#D97706")
              val LINK = Color.parseColor("#2563EB")
              val TRACK = Color.parseColor("#E8EAEE")
              val TEAL = Color.parseColor("#14B8A6")
              val CORAL = Color.parseColor("#FF6B4A")
              val MINT = Color.parseColor("#D4F4EA")
              val PEACH = Color.parseColor("#FFDFD0")
              val PAGE_END = Color.parseColor("#FAFBFC")

              fun gradient(top: Int, bottom: Int): GradientDrawable =
                  GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(top, bottom))

