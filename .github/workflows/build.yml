                  android:pathData="M40,50 L68,50 A4,4 0 0 1 72,54 L72,76 A4,4 0 0 1 68,80 L40,80 A4,4 0 0 1 36,76 L36,54 A4,4 0 0 1 40,50 Z" />
              <!-- Lỗ khóa -->
              <path
                  android:fillColor="#E5484D"
                  android:pathData="M54,58.5 A3.5,3.5 0 1 1 54,65.5 A3.5,3.5 0 1 1 54,58.5 Z M52.5,64 L55.5,64 L56.5,72 L51.5,72 Z" />
