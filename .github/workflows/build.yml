          KHOAEOF
          mkdir -p app/src/main/java/com/khoamt5/app
          cat > app/src/main/java/com/khoamt5/app/LockStore.kt <<'KHOAEOF'
          package com.khoamt5.app

          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Calendar
          import java.util.Locale

          /** Một lần khóa trong nhật ký. */
          data class LogEntry(val time: Long, val minutes: Long, val apps: String, val note: String)

          /**
           * Lưu thời điểm hết khóa, danh sách app bị khóa, lời nhắc, nhật ký và chuỗi ngày kỷ luật
           * vào SharedPreferences nên vẫn còn khi tắt app, vuốt app khỏi đa nhiệm hoặc khởi động lại máy.
           */
          object LockStore {
              const val MT5_PACKAGE = "net.metaquotes.metatrader5"

              /** Giá trị đặc biệt: khóa tới hết ngày (0 giờ sáng hôm sau). */
              const val END_OF_DAY = -1L

              /** Các mức thời gian cho mục "Khác" (phút): 1 phút (để thử) ... 24 giờ. */
              val STEPS_MIN = longArrayOf(1, 5, 15, 30, 60, 120, 240, 480, 720, 1440)

              const val DEFAULT_REMINDER =
                  "Hít thở sâu. Một lệnh thua không phải là cả ngày. Làm đúng luật mới là thắng."

              private const val PREFS = "lock"
              private const val KEY_STARTED = "started"
              private const val KEY_UNTIL = "until"
              private const val KEY_TOTAL = "total"
              private const val KEY_SEL_MIN = "sel_min"
              private const val KEY_PACKAGES = "packages"
              private const val KEY_REMINDER = "reminder"
              private const val KEY_LOG = "log"
              private const val KEY_DAYS = "days"

              // Thông tin chẩn đoán: mỗi lớp chặn vừa "thấy" app nào mở.
              @Volatile var accSeen: String = ""
              @Volatile var watchSeen: String = ""
              @Volatile var watchAliveAt: Long = 0L

              private fun prefs(c: Context) =
                  c.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              // ---------- Định dạng thời gian ----------

              fun label(minutes: Long): String = when {
                  minutes < 60L -> "$minutes phút"
                  minutes % 60L == 0L -> "${minutes / 60L} giờ"
                  else -> "${minutes / 60L} giờ ${minutes % 60L} phút"
              }

              fun formatMs(ms: Long): String {
                  val s = (ms + 999L) / 1000L
                  val h = s / 3600L
                  val m = (s % 3600L) / 60L
                  val sec = s % 60L
                  return if (h > 0L) String.format("%d:%02d:%02d", h, m, sec)
                  else String.format("%02d:%02d", m, sec)
              }

              // ---------- Thời gian khóa đã chọn ----------

              fun selectedMinutes(c: Context): Long = prefs(c).getLong(KEY_SEL_MIN, 15L)

              fun setSelectedMinutes(c: Context, minutes: Long) {
                  prefs(c).edit().putLong(KEY_SEL_MIN, minutes).apply()
              }

              fun minutesUntilMidnight(): Long {
                  val now = Calendar.getInstance()
                  val next = Calendar.getInstance()
                  next.add(Calendar.DAY_OF_YEAR, 1)
                  next.set(Calendar.HOUR_OF_DAY, 0)
                  next.set(Calendar.MINUTE, 0)
                  next.set(Calendar.SECOND, 0)
                  next.set(Calendar.MILLISECOND, 0)
                  val ms = next.timeInMillis - now.timeInMillis
                  return ((ms + 59_999L) / 60_000L).coerceAtLeast(1L)
              }

              /** Đổi giá trị đã chọn (có thể là END_OF_DAY) thành số phút thật. */
              fun resolveMinutes(selected: Long): Long =
                  if (selected == END_OF_DAY) minutesUntilMidnight() else selected

              // ---------- Danh sách app ----------

              /** Danh sách app sẽ bị khóa. Mặc định chỉ có MetaTrader 5. */
              fun lockedPackages(c: Context): Set<String> =
                  prefs(c).getStringSet(KEY_PACKAGES, null)?.toSet() ?: setOf(MT5_PACKAGE)

              /** Đổi danh sách app. Đang khóa thì không cho đổi. */
              fun setLockedPackages(c: Context, packages: Set<String>) {
                  if (remainingMs(c) > 0L) return
                  prefs(c).edit().putStringSet(KEY_PACKAGES, HashSet(packages)).apply()
              }

              /**
               * App không bao giờ bị khóa, để khỏi mất đường gọi khẩn cấp
               * hoặc kẹt không thoát được ra màn hình chính / cài đặt.
               */
              fun protectedPackages(c: Context): Set<String> {
                  val pm = c.packageManager
                  val result = mutableSetOf(
                      c.packageName,
                      "com.android.systemui",
                      "com.android.settings",
                      "com.android.phone",
                      "com.android.emergency",
                      "com.android.server.telecom",
                      "com.android.dialer",
                      "com.google.android.dialer",
                      "com.samsung.android.dialer",
                      "com.android.incallui",
                      "com.samsung.android.incallui",
                      "com.android.contacts",
                      "com.google.android.contacts"
                  )
                  fun addAll(intent: Intent) {
                      try {
                          pm.queryIntentActivities(intent, 0).forEach { result.add(it.activityInfo.packageName) }
                      } catch (_: Exception) {
                      }
                  }
                  addAll(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME))
                  addAll(Intent(Intent.ACTION_DIAL))
                  addAll(Intent(Settings.ACTION_SETTINGS))
                  return result
              }

              // ---------- Lời nhắc ----------

              fun reminder(c: Context): String {
                  val s = prefs(c).getString(KEY_REMINDER, null)
                  return if (s == null || s.isBlank()) DEFAULT_REMINDER else s
              }

              fun setReminder(c: Context, text: String) {
                  prefs(c).edit().putString(KEY_REMINDER, text.trim()).apply()
              }

              // ---------- Khóa ----------

              fun isLocked(c: Context): Boolean = remainingMs(c) > 0L

              /** Bắt đầu khóa. Đang khóa rồi thì không làm gì (không thể kéo dài hay rút ngắn). */
              fun start(c: Context, minutes: Long) {
                  if (remainingMs(c) > 0) return
                  val now = System.currentTimeMillis()
                  prefs(c).edit()
                      .putLong(KEY_STARTED, now)
                      .putLong(KEY_UNTIL, now + minutes * 60_000L)
                      .putLong(KEY_TOTAL, minutes * 60_000L)
                      .commit()
              }

              fun totalMs(c: Context): Long = prefs(c).getLong(KEY_TOTAL, 0L)

              /** Số mili-giây còn lại, 0 nếu không khóa. */
              fun remainingMs(c: Context): Long {
                  val p = prefs(c)
                  val until = p.getLong(KEY_UNTIL, 0L)
                  if (until == 0L) return 0L
                  val started = p.getLong(KEY_STARTED, 0L)
                  val now = System.currentTimeMillis()
                  // Chỉnh đồng hồ lùi về trước lúc bắt đầu thì không được lợi: coi như vừa bắt đầu.
                  val effectiveNow = if (now < started) started else now
                  return (until - effectiveNow).coerceAtLeast(0L)
              }

              // ---------- Nhật ký các lần khóa ----------

              fun addLog(c: Context, minutes: Long, apps: String) {
                  val old = try {
                      JSONArray(prefs(c).getString(KEY_LOG, "[]"))
                  } catch (_: Exception) {
                      JSONArray()
                  }
                  val entry = JSONObject()
                  entry.put("t", System.currentTimeMillis())
                  entry.put("m", minutes)
                  entry.put("apps", apps)
                  entry.put("note", "")
                  val out = JSONArray()
                  out.put(entry)
                  var i = 0
                  while (i < old.length() && out.length() < 100) {
                      out.put(old.get(i))
                      i++
                  }
                  prefs(c).edit().putString(KEY_LOG, out.toString()).apply()
              }

              fun readLog(c: Context): List<LogEntry> {
                  val arr = try {
                      JSONArray(prefs(c).getString(KEY_LOG, "[]"))
                  } catch (_: Exception) {
                      return emptyList()
                  }
                  val out = ArrayList<LogEntry>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      out.add(LogEntry(o.optLong("t"), o.optLong("m"), o.optString("apps"), o.optString("note")))
                  }
                  return out
              }

              fun setLogNote(c: Context, index: Int, note: String) {
                  val arr = try {
                      JSONArray(prefs(c).getString(KEY_LOG, "[]"))
                  } catch (_: Exception) {
                      return
                  }
                  val o = arr.optJSONObject(index) ?: return
                  o.put("note", note.trim())
                  prefs(c).edit().putString(KEY_LOG, arr.toString()).apply()
              }

              // ---------- Chuỗi ngày giữ kỷ luật ----------

              fun dayKey(offsetDays: Int): String {
                  val cal = Calendar.getInstance()
                  cal.add(Calendar.DAY_OF_YEAR, offsetDays)
                  return String.format(
                      Locale.US, "%04d-%02d-%02d",
                      cal.get(Calendar.YEAR), cal.get(Calendar.MONTH) + 1, cal.get(Calendar.DAY_OF_MONTH)
                  )
              }

              private fun readDays(c: Context): JSONObject = try {
                  JSONObject(prefs(c).getString(KEY_DAYS, "{}"))
              } catch (_: Exception) {
                  JSONObject()
              }

              fun markToday(c: Context, kept: Boolean) {
                  val o = readDays(c)
                  o.put(dayKey(0), kept)
                  prefs(c).edit().putString(KEY_DAYS, o.toString()).apply()
              }

              /** true = giữ đúng luật, false = đã phá luật, null = hôm nay chưa ghi. */
              fun todayMark(c: Context): Boolean? {
                  val o = readDays(c)
                  val k = dayKey(0)
                  return if (o.has(k)) o.optBoolean(k) else null
              }

              /** Ghi nhận của một ngày (offset 0 = hôm nay, -1 = hôm qua...). */
              fun dayMark(c: Context, offset: Int): Boolean? {
                  val o = readDays(c)
                  val k = dayKey(offset)
                  return if (o.has(k)) o.optBoolean(k) else null
              }

              fun dayOfMonth(offset: Int): Int {
                  val cal = Calendar.getInstance()
                  cal.add(Calendar.DAY_OF_YEAR, offset)
                  return cal.get(Calendar.DAY_OF_MONTH)
              }

              /** Số ngày liên tiếp giữ đúng luật (hôm nay chưa ghi thì tính từ hôm qua). */
              fun streak(c: Context): Int {
                  val o = readDays(c)
                  var offset = if (o.has(dayKey(0))) 0 else -1
                  var n = 0
                  while (n < 3650) {
                      val k = dayKey(offset)
                      if (o.has(k) && o.optBoolean(k)) {
                          n++
                          offset--
                      } else {
                          break
                      }
                  }
                  return n
              }

              fun keptTotal(c: Context): Int {
                  val o = readDays(c)
                  var n = 0
                  val keys = o.keys()
                  while (keys.hasNext()) {
                      if (o.optBoolean(keys.next())) n++
                  }
                  return n
              }
          }
          KHOAEOF
          mkdir -p app/src/main/java/com/khoamt5/app
          cat > app/src/main/java/com/khoamt5/app/LockService.kt <<'KHOAEOF'
          package com.khoamt5.app

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent

          /**
           * Lớp chặn 1 (Trợ năng): nghe sự kiện đổi cửa sổ. Khi app vừa hiện lên nằm trong danh sách
           * khóa và đang trong thời gian khóa:
           *  - Nếu lớp 2 đang chạy (nó hiện màn hình lời nhắc rồi tự đẩy về màn hình chính),
           *    lớp này chỉ làm dự phòng: sau 8 giây mà vẫn còn ở app đó thì đẩy về màn hình chính.
           *  - Nếu lớp 2 không chạy thì đẩy về màn hình chính ngay.
           * Không đọc nội dung màn hình (canRetrieveWindowContent = false).
           */
          class LockService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastLaunch = 0L
              private var currentPkg: String? = null
              private var backup: Runnable? = null
              private val protectedPkgs by lazy { LockStore.protectedPackages(this) }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return

                  if (pkg != "com.android.systemui") currentPkg = pkg
                  if (pkg != packageName && pkg != "com.android.systemui") {
                      LockStore.accSeen = pkg
                  }

                  if (pkg !in LockStore.lockedPackages(this)) return
                  if (pkg in protectedPkgs) return
                  if (LockStore.remainingMs(this) <= 0L) return

                  val layer2Alive = System.currentTimeMillis() - LockStore.watchAliveAt < 2000L &&
                      Perms.overlay(this)
                  if (layer2Alive) {
                      val old = backup
                      if (old != null) handler.removeCallbacks(old)
                      val r = Runnable {
                          if (currentPkg == pkg && LockStore.remainingMs(this) > 0L) {
                              performGlobalAction(GLOBAL_ACTION_HOME)
                          }
                      }
                      backup = r
                      handler.postDelayed(r, 8000L)
                      return
                  }

                  // Bước chắc chắn: đẩy app ra màn hình chính.
                  performGlobalAction(GLOBAL_ACTION_HOME)

                  // Thêm: mở màn hình đếm ngược của app (có thể bị hệ thống chặn, không sao).
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastLaunch > 1000L) {
                      lastLaunch = now
                      try {
                          val intent = Intent(this, MainActivity::class.java)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          startActivity(intent)
                      } catch (_: Exception) {
                      }
                  }
              }

              override fun onInterrupt() {}
          }
          KHOAEOF
          mkdir -p app/src/main/java/com/khoamt5/app
          cat > app/src/main/java/com/khoamt5/app/WatcherService.kt <<'KHOAEOF'
          package com.khoamt5.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          /**
           * Lớp chặn 2: dịch vụ chạy nền (có thông báo cố định nên khó bị hệ thống tắt).
           * Cứ 0,3 giây đọc xem app nào đang ở trên cùng (qua Usage access). Nếu đó là app bị khóa
           * thì che kín màn hình bằng một lớp phủ đếm ngược và đẩy về màn hình chính.
           * Chỉ chạy trong lúc đang khóa, hết giờ tự tắt.
           */
          class WatcherService : Service() {

              companion object {
                  private const val CHANNEL_ID = "khoa_app_watch"
                  private const val NOTIF_ID = 1001
                  private const val EV_FG = 1          // app lên trước
                  private const val EV_BG = 2          // app xuống nền
                  private const val EV_SCREEN_OFF = 16 // tắt màn hình
                  private const val POLL_MS = 300L
                  private const val HOLD_MS = 7000L   // giữ màn hình lời nhắc trước khi về màn hình chính

                  fun start(c: Context) {
                      try {
                          c.startForegroundService(Intent(c, WatcherService::class.java))
                      } catch (_: Exception) {
                      }
                  }
              }

              private val handler = Handler(Looper.getMainLooper())
              private var windowManager: WindowManager? = null
              private var overlay: FrameLayout? = null
              private var ringView: RingView? = null
              private var reminderView: TextView? = null
              private var hintView: TextView? = null
              private var shownAt = 0L
              private var fgPackage: String? = null
              private var lastEventTs = 0L
              private var lastHome = 0L
              private var protectedPkgs: Set<String> = emptySet()
              private var running = false

              private val poll = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val remaining = LockStore.remainingMs(this@WatcherService)
                      if (remaining <= 0L) {
                          running = false
                          removeOverlay()
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                          return
                      }
                      LockStore.watchAliveAt = System.currentTimeMillis()
                      refreshForeground()

                      val pkg = fgPackage
                      if (pkg != null &&
                          pkg in LockStore.lockedPackages(this@WatcherService) &&
                          pkg !in protectedPkgs
                      ) {
                          showOverlay(remaining)
                      } else {
                          removeOverlay()
                      }
                      handler.postDelayed(this, POLL_MS)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  protectedPkgs = LockStore.protectedPackages(this)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  goForeground()
                  if (!LockStore.isLocked(this)) {
                      running = false
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!running) {
                      running = true
                      lastEventTs = System.currentTimeMillis() - 2L * 60L * 60L * 1000L
                      handler.post(poll)
                  }
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  running = false
                  handler.removeCallbacksAndMessages(null)
                  removeOverlay()
                  super.onDestroy()
              }

              private fun goForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "Block", NotificationManager.IMPORTANCE_LOW)
                  )
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                      .setContentTitle("Block đang chạy")
                      .setContentText("Đang giám sát các app bị khóa")
                      .setContentIntent(open)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }
              }

              /** Cập nhật app đang ở trên cùng dựa trên sự kiện sử dụng mới nhất. */
              private fun refreshForeground() {
                  val usm = getSystemService(Context.USAGE_STATS_SERVICE) as? UsageStatsManager ?: return
                  try {
                      val events = usm.queryEvents(lastEventTs, System.currentTimeMillis())
                      val e = UsageEvents.Event()
                      var maxTs = lastEventTs
                      while (events.hasNextEvent()) {
                          events.getNextEvent(e)
                          if (e.timeStamp > maxTs) maxTs = e.timeStamp
                          when (e.eventType) {
                              EV_FG -> fgPackage = e.packageName
                              EV_BG -> if (e.packageName == fgPackage) fgPackage = null
                              EV_SCREEN_OFF -> fgPackage = null
                          }
                      }
                      lastEventTs = maxTs
                  } catch (_: Exception) {
                  }
                  val p = fgPackage
                  if (p != null && p != packageName && p != "com.android.systemui") {
                      LockStore.watchSeen = p
                  }
              }

              private fun createOverlay() {
                  val wm = windowManager ?: return
                  if (!Settings.canDrawOverlays(this)) return
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER
                  val pad = Ui.dp(this, 28)
                  box.setPadding(pad, pad, pad, pad)

                  val tag = Ui.text(this, "ĐANG KHÓA", 14f, Ui.ACCENT, true)
                  tag.gravity = Gravity.CENTER
                  tag.letterSpacing = 0.15f
                  box.addView(tag, Ui.lp(this, 0))

                  val ring = RingView(this)
                  box.addView(ring, Ui.lp(this, 12, Ui.dp(this, 260), Ui.dp(this, 260)))

                  val reminder = Ui.text(this, "", 22f, Ui.TEXT, true)
                  reminder.gravity = Gravity.CENTER
                  box.addView(reminder, Ui.lp(this, 20))

                  val hint = Ui.text(this, "Bấm nút Home để thoát", 14f, Ui.MUTED)
                  hint.gravity = Gravity.CENTER
                  box.addView(hint, Ui.lp(this, 20))

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.OPAQUE
                  )
                  try {
                      val frame = FrameLayout(this)
                      val aurora = AuroraView(this)
                      aurora.locked = true
                      frame.addView(aurora, FrameLayout.LayoutParams(Ui.MATCH, Ui.MATCH))
                      frame.addView(box, FrameLayout.LayoutParams(Ui.MATCH, Ui.MATCH))
                      wm.addView(frame, lp)
                      overlay = frame
                      ringView = ring
                      reminderView = reminder
                      hintView = hint
                  } catch (_: Exception) {
                  }
              }

              private fun showOverlay(remainingMs: Long) {
                  if (overlay == null) {
                      createOverlay()
                      if (overlay == null) {
                          // Không hiện được lớp phủ (thiếu quyền): đẩy về màn hình chính ngay.
                          goHome()
                          return
                      }
                      shownAt = SystemClock.elapsedRealtime()
                  }
                  val ring = ringView
                  if (ring != null) {
                      val total = LockStore.totalMs(this).coerceAtLeast(1L)
                      ring.ringColor = Ui.CORAL
                      ring.progress = remainingMs.toFloat() / total.toFloat()
                      ring.centerText = LockStore.formatMs(remainingMs)
                      ring.subText = "còn lại"
                  }
                  reminderView?.text = LockStore.reminder(this)
                  val left = HOLD_MS - (SystemClock.elapsedRealtime() - shownAt)
                  if (left > 0L) {
                      hintView?.text = "Tự về màn hình chính sau " + ((left + 999L) / 1000L) + " giây"
                  } else {
                      hintView?.text = "Đang về màn hình chính…"
                      goHome()
                  }
              }

              private fun removeOverlay() {
                  val v = overlay ?: return
                  try {
                      windowManager?.removeView(v)
                  } catch (_: Exception) {
                  }
                  overlay = null
                  ringView = null
                  reminderView = null
                  hintView = null
              }

              private fun goHome() {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastHome < 800L) return
                  lastHome = now
                  try {
                      startActivity(
                          Intent(Intent.ACTION_MAIN)
                              .addCategory(Intent.CATEGORY_HOME)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  } catch (_: Exception) {
                  }
              }
          }
