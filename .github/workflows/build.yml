          cat > app/src/main/java/com/khoamt5/app/MainActivity.kt <<'KHOAEOF'
          package com.khoamt5.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.AppOpsManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.Process
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val handler = Handler(Looper.getMainLooper())

              private lateinit var title: TextView
              private lateinit var countdown: TextView
              private lateinit var appsText: TextView
              private lateinit var selectBtn: Button
              private lateinit var durationRow: LinearLayout
              private lateinit var durationLabel: TextView
              private lateinit var minusBtn: Button
              private lateinit var plusBtn: Button
              private lateinit var lockBtn: Button
              private lateinit var hint: TextView
              private lateinit var statusText: TextView
              private lateinit var usageBtn: Button
              private lateinit var overlayBtn: Button
              private lateinit var notifBtn: Button
              private lateinit var battBtn: Button
              private lateinit var accBtn: Button
              private lateinit var infoBtn: Button

              private var summary: String = ""
              private var selectCount: Int = 0
              private var lastRestart: Long = 0L
              private val labelCache = HashMap<String, String>()

              private val tick = object : Runnable {
                  override fun run() {
                      refresh()
                      handler.postDelayed(this, 500L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUi()
              }

              override fun onResume() {
                  super.onResume()
                  updateSummary()
                  handler.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(tick)
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun roundedBg(color: Int): GradientDrawable = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(24).toFloat()
              }

              private fun makeBtn(text: String, onClick: () -> Unit): Button = Button(this).apply {
                  this.text = text
                  isAllCaps = false
                  setOnClickListener { onClick() }
              }

              private fun openFirst(vararg intents: Intent) {
                  for (i in intents) {
                      try {
                          startActivity(i)
                          return
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun pkgUri(): Uri = Uri.parse("package:$packageName")

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(24), dp(24), dp(24), dp(24))
                      setBackgroundColor(Color.parseColor("#12161C"))
                  }

                  title = TextView(this).apply {
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  countdown = TextView(this).apply {
                      textSize = 52f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.MONOSPACE
                      gravity = Gravity.CENTER
                  }
                  appsText = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.parseColor("#7FB2FF"))
                      gravity = Gravity.CENTER
                  }
                  selectBtn = makeBtn("") { showPicker() }

                  minusBtn = Button(this).apply {
                      text = "−"
                      textSize = 24f
                      setOnClickListener { changeDuration(-1) }
                  }
                  plusBtn = Button(this).apply {
                      text = "+"
                      textSize = 24f
                      setOnClickListener { changeDuration(+1) }
                  }
                  durationLabel = TextView(this).apply {
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  durationRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(minusBtn, LinearLayout.LayoutParams(dp(72), dp(56)))
                      addView(durationLabel, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      addView(plusBtn, LinearLayout.LayoutParams(dp(72), dp(56)))
                  }

                  lockBtn = Button(this).apply {
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      isAllCaps = false
                      setOnClickListener { onLockClicked() }
                  }
                  hint = TextView(this).apply {
                      textSize = 14f
                      setTextColor(Color.parseColor("#9AA4B2"))
                      gravity = Gravity.CENTER
                  }
                  statusText = TextView(this).apply {
                      textSize = 12f
                      setTextColor(Color.parseColor("#6F7A8A"))
                      gravity = Gravity.CENTER
                  }

                  usageBtn = makeBtn("Cấp quyền xem app đang mở (Usage access)") {
                      openFirst(
                          Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS, pkgUri()),
                          Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)
                      )
                  }
                  overlayBtn = makeBtn("Cấp quyền hiện trên các app khác") {
                      openFirst(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, pkgUri()),
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION)
                      )
                  }
                  notifBtn = makeBtn("Cho phép thông báo") {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 100)
                      }
                  }
                  battBtn = makeBtn("Không hạn chế pin cho Khóa App") {
                      openFirst(
                          Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, pkgUri()),
                          Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)
                      )
                  }
                  accBtn = makeBtn("Bật Trợ năng (lớp chặn 1)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  infoBtn = makeBtn("Công tắc Trợ năng bị mờ? Mở thông tin ứng dụng") {
                      openFirst(
                          Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).setData(pkgUri())
                      )
                  }

                  fun lp(top: Int, height: Int = LinearLayout.LayoutParams.WRAP_CONTENT) =
                      LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, height)
                          .apply { topMargin = dp(top) }

                  root.addView(title, lp(0))
                  root.addView(countdown, lp(8))
                  root.addView(appsText, lp(8))
                  root.addView(selectBtn, lp(12))
                  root.addView(durationRow, lp(12))
                  root.addView(lockBtn, lp(16, dp(100)))
                  root.addView(hint, lp(16))
                  root.addView(usageBtn, lp(16))
                  root.addView(overlayBtn, lp(4))
                  root.addView(notifBtn, lp(4))
                  root.addView(battBtn, lp(4))
                  root.addView(accBtn, lp(4))
                  root.addView(infoBtn, lp(4))
                  root.addView(statusText, lp(20))

                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(Color.parseColor("#12161C"))
                      addView(
                          root,
                          FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                      )
                  }
                  setContentView(scroll)
              }

              // ---------- Kiểm tra quyền ----------

              private fun hasUsageAccess(): Boolean {
                  val ops = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = ops.checkOpNoThrow(
                      AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName
                  )
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              private fun hasNotifPermission(): Boolean =
                  Build.VERSION.SDK_INT < 33 ||
                      checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) ==
                      PackageManager.PERMISSION_GRANTED

              private fun isBatteryUnrestricted(): Boolean {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  return pm.isIgnoringBatteryOptimizations(packageName)
              }

              private fun isServiceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val cn = ComponentName(this, LockService::class.java)
                  val full = cn.flattenToString()
                  val short = cn.flattenToShortString()
                  return enabled.split(':').any { it.equals(full, true) || it.equals(short, true) }
              }

              // ---------- Chọn app ----------

              private fun appLabel(pkg: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
              } catch (_: Exception) {
                  pkg
              }

              private fun labelOf(pkg: String): String = labelCache.getOrPut(pkg) { appLabel(pkg) }

              /** Tính lại chuỗi tóm tắt app đã chọn (không làm mỗi 500ms cho nhẹ). */
              private fun updateSummary() {
                  val names = LockStore.lockedPackages(this).map { appLabel(it) }.sorted()
                  selectCount = names.size
                  summary = when {
                      names.isEmpty() -> "chưa chọn app nào"
                      names.size <= 3 -> names.joinToString(", ")
                      else -> names.take(3).joinToString(", ") + " và ${names.size - 3} app khác"
                  }
              }

              private fun showPicker() {
                  if (LockStore.remainingMs(this) > 0L) return
                  val pm = packageManager
                  val protectedPkgs = LockStore.protectedPackages(this)
                  val current = LockStore.lockedPackages(this)

                  val launcherIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(launcherIntent, 0)
                      .map { it.activityInfo.packageName to it.loadLabel(pm).toString() }
                      .distinctBy { it.first }
                      .filter { it.first !in protectedPkgs }
                      .sortedWith(
                          compareByDescending<Pair<String, String>> { it.first in current }
                              .thenBy { it.second.lowercase() }
                      )

                  if (apps.isEmpty()) {
                      Toast.makeText(this, "Không tìm thấy app nào để chọn", Toast.LENGTH_LONG).show()
                      return
                  }

                  val labels = apps.map { it.second }.toTypedArray<CharSequence>()
                  val checked = BooleanArray(apps.size) { apps[it].first in current }
                  val chosen = current.toMutableSet()
                  val inList = apps.map { it.first }.toSet()

                  AlertDialog.Builder(this)
                      .setTitle("Chọn app cần khóa")
                      .setMultiChoiceItems(labels, checked) { _, which, isChecked ->
                          val p = apps[which].first
                          if (isChecked) chosen.add(p) else chosen.remove(p)
                      }
                      .setPositiveButton("Lưu") { _, _ ->
                          LockStore.setLockedPackages(this, chosen.filter { it in inList }.toSet())
                          updateSummary()
                          refresh()
                      }
                      .setNegativeButton("Hủy", null)
                      .show()
              }

              // ---------- Khóa ----------

              private fun changeDuration(delta: Int) {
                  if (LockStore.remainingMs(this) > 0L) return
                  LockStore.setSelectedIndex(this, LockStore.selectedIndex(this) + delta)
                  refresh()
              }

              private fun onLockClicked() {
                  val layer1 = isServiceEnabled()
                  val layer2 = hasUsageAccess() && Settings.canDrawOverlays(this)
                  if (!layer1 && !layer2) {
                      Toast.makeText(this, "Hãy bật ít nhất một lớp chặn ở bên dưới trước", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (selectCount == 0) {
                      Toast.makeText(this, "Hãy chọn ít nhất 1 app cần khóa", Toast.LENGTH_LONG).show()
                      return
                  }
                  val minutes = LockStore.STEPS_MIN[LockStore.selectedIndex(this)]
                  if (minutes >= 60L) {
                      // Khóa dài thì hỏi lại một lần cho khỏi bấm nhầm.
                      AlertDialog.Builder(this)
                          .setTitle("Khóa ${LockStore.label(minutes)}?")
                          .setMessage(
                              "App bị khóa: $summary.\n\n" +
                                  "Bắt đầu rồi thì không dừng được cho tới khi hết giờ. " +
                                  "Lệnh MT5 đang mở vẫn chạy, hãy chắc chắn đã đặt SL."
                          )
                          .setPositiveButton("Khóa") { _, _ -> doLock(minutes) }
                          .setNegativeButton("Hủy", null)
                          .show()
                  } else {
                      doLock(minutes)
                  }
              }

              private fun doLock(minutes: Long) {
                  LockStore.start(this, minutes)
                  if (hasUsageAccess()) WatcherService.start(this)
                  refresh()
              }

              private fun vis(show: Boolean): Int = if (show) View.VISIBLE else View.GONE

              private fun seenSuffix(pkg: String): String =
                  if (pkg.isEmpty()) "" else " · vừa thấy: ${labelOf(pkg)}"

              private fun refresh() {
                  val remaining = LockStore.remainingMs(this)
                  val acc = isServiceEnabled()
                  val usage = hasUsageAccess()
                  val overlayOk = Settings.canDrawOverlays(this)
                  val layer2 = usage && overlayOk
                  val watcherAlive = System.currentTimeMillis() - LockStore.watchAliveAt < 3000L

                  // Đang khóa mà dịch vụ giám sát chết thì bật lại (tối đa 5 giây một lần).
                  if (remaining > 0L && usage && !watcherAlive &&
                      System.currentTimeMillis() - lastRestart > 5000L
                  ) {
                      lastRestart = System.currentTimeMillis()
                      WatcherService.start(this)
                  }

                  usageBtn.visibility = vis(!usage)
                  overlayBtn.visibility = vis(!overlayOk)
                  notifBtn.visibility = vis(!hasNotifPermission())
                  battBtn.visibility = vis(!isBatteryUnrestricted())
                  accBtn.visibility = vis(!acc)
                  infoBtn.visibility = vis(!acc)

                  appsText.text = "App bị khóa: $summary"
                  statusText.text =
                      "Lớp 1 (Trợ năng): " + (if (acc) "bật" else "tắt") + seenSuffix(LockStore.accSeen) + "\n" +
                          "Lớp 2 (giám sát nền): " +
                          (if (watcherAlive) "đang chạy" else if (layer2) "sẵn sàng, chạy khi khóa" else "chưa đủ quyền") +
                          seenSuffix(LockStore.watchSeen)

                  if (remaining > 0L) {
                      title.text = "ĐANG KHÓA"
                      countdown.text = LockStore.formatMs(remaining)
                      selectBtn.visibility = View.GONE
                      durationRow.visibility = View.GONE
                      lockBtn.isEnabled = false
                      lockBtn.text = "Đang khóa..."
                      lockBtn.background = roundedBg(Color.parseColor("#3A4250"))
                      hint.text = "Hết giờ sẽ tự mở khóa. Không có nút dừng."
                  } else {
                      val idx = LockStore.selectedIndex(this)
                      val minutes = LockStore.STEPS_MIN[idx]
                      title.text = "Khóa App"
                      countdown.text = LockStore.formatMs(minutes * 60_000L)
                      selectBtn.visibility = View.VISIBLE
                      selectBtn.text = "Chọn app cần khóa ($selectCount)"
                      durationRow.visibility = View.VISIBLE
                      durationLabel.text = LockStore.label(minutes)
                      minusBtn.isEnabled = idx > 0
                      plusBtn.isEnabled = idx < LockStore.STEPS_MIN.size - 1
                      lockBtn.isEnabled = true
                      lockBtn.text = "KHÓA ${LockStore.label(minutes).uppercase()}"
                      lockBtn.background = roundedBg(Color.parseColor("#D93636"))
                      hint.text = when {
                          acc && layer2 ->
                              "Chọn app và thời gian, rồi bấm khóa. Lệnh MT5 đang mở vẫn chạy, nhớ đặt SL."
                          acc || layer2 ->
                              "Mới bật 1 trong 2 lớp chặn. Cấp thêm các quyền bên dưới để chắc hơn."
                          else ->
                              "Chưa bật lớp chặn nào. Hãy cấp các quyền bên dưới."
                      }
                  }
              }
          }
          KHOAEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KhoaMT5-apk
          path: app/build/outputs/apk/debug/app-debug.apk
