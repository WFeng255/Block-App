name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tao cac file ma nguon cua app
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'KHOAEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.khoamt5.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.khoamt5.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          KHOAEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KHOAEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Cho phép app liệt kê các app có biểu tượng trên màn hình để người dùng tick chọn. -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.settings.SETTINGS" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Khóa App"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LockService"
                      android:exported="false"
                      android:label="Khóa App"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>

          </manifest>
          KHOAEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'KHOAEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="50"
              android:description="@string/service_desc" />
          KHOAEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'KHOAEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_desc">Chỉ theo dõi việc mở các app bạn đã chọn khóa. Khi đang trong thời gian khóa, dịch vụ này đưa bạn về màn hình chính mỗi lần mở một app trong danh sách. Không đọc nội dung màn hình, không thu thập dữ liệu.</string>
          </resources>
          KHOAEOF
          mkdir -p app/src/main/java/com/khoamt5/app
          cat > app/src/main/java/com/khoamt5/app/LockStore.kt <<'KHOAEOF'
          package com.khoamt5.app

          import android.content.Context
          import android.content.Intent
          import android.provider.Settings

          /**
           * Lưu thời điểm hết khóa và danh sách app bị khóa vào SharedPreferences
           * nên vẫn còn khóa khi tắt app, vuốt app khỏi đa nhiệm hoặc khởi động lại máy.
           */
          object LockStore {
              const val MT5_PACKAGE = "net.metaquotes.metatrader5"

              /** Các mức thời gian khóa (phút): 5 phút ... 24 giờ. */
              val STEPS_MIN = longArrayOf(5, 15, 30, 60, 120, 240, 480, 720, 1440)
              private const val DEFAULT_INDEX = 1 // 15 phút

              private const val PREFS = "lock"
              private const val KEY_STARTED = "started"
              private const val KEY_UNTIL = "until"
              private const val KEY_SELECTED = "selected"
              private const val KEY_PACKAGES = "packages"

              private fun prefs(c: Context) =
                  c.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun label(minutes: Long): String = when {
                  minutes < 60L -> "$minutes phút"
                  minutes % 60L == 0L -> "${minutes / 60L} giờ"
                  else -> "${minutes / 60L} giờ ${minutes % 60L} phút"
              }

              fun selectedIndex(c: Context): Int =
                  prefs(c).getInt(KEY_SELECTED, DEFAULT_INDEX).coerceIn(0, STEPS_MIN.size - 1)

              fun setSelectedIndex(c: Context, index: Int) {
                  prefs(c).edit().putInt(KEY_SELECTED, index.coerceIn(0, STEPS_MIN.size - 1)).apply()
              }

              /** Danh sách app sẽ bị khóa. Mặc định chỉ có MetaTrader 5. */
              fun lockedPackages(c: Context): Set<String> =
                  prefs(c).getStringSet(KEY_PACKAGES, null)?.toSet() ?: setOf(MT5_PACKAGE)

              /** Đổi danh sách app. Đang khóa thì không cho đổi. */
              fun setLockedPackages(c: Context, packages: Set<String>) {
                  if (remainingMs(c) > 0L) return
                  prefs(c).edit().putStringSet(KEY_PACKAGES, HashSet(packages)).apply()
              }

              /**
               * App không bao giờ bị khóa, để khỏi mất đường gọi khẩn cấp
               * hoặc kẹt không thoát được ra màn hình chính / cài đặt.
               */
              fun protectedPackages(c: Context): Set<String> {
                  val pm = c.packageManager
                  val result = mutableSetOf(
                      c.packageName,
                      "com.android.systemui",
                      "com.android.settings",
                      "com.android.phone",
                      "com.android.emergency",
                      "com.android.server.telecom",
                      "com.android.dialer",
                      "com.google.android.dialer",
                      "com.samsung.android.dialer",
                      "com.android.incallui",
                      "com.samsung.android.incallui",
                      "com.android.contacts",
                      "com.google.android.contacts"
                  )
                  fun addAll(intent: Intent) {
                      try {
                          pm.queryIntentActivities(intent, 0).forEach { result.add(it.activityInfo.packageName) }
                      } catch (_: Exception) {
                      }
                  }
                  addAll(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME))
                  addAll(Intent(Intent.ACTION_DIAL))
                  addAll(Intent(Settings.ACTION_SETTINGS))
                  return result
              }

              /** Bắt đầu khóa. Đang khóa rồi thì không làm gì (không thể kéo dài hay rút ngắn). */
              fun start(c: Context, minutes: Long) {
                  if (remainingMs(c) > 0) return
                  val now = System.currentTimeMillis()
                  prefs(c).edit()
                      .putLong(KEY_STARTED, now)
                      .putLong(KEY_UNTIL, now + minutes * 60_000L)
                      .commit()
              }

              /** Số mili-giây còn lại, 0 nếu không khóa. */
              fun remainingMs(c: Context): Long {
                  val p = prefs(c)
                  val until = p.getLong(KEY_UNTIL, 0L)
                  if (until == 0L) return 0L
                  val started = p.getLong(KEY_STARTED, 0L)
                  val now = System.currentTimeMillis()
                  // Chỉnh đồng hồ lùi về trước lúc bắt đầu thì không được lợi: coi như vừa bắt đầu.
                  val effectiveNow = if (now < started) started else now
                  return (until - effectiveNow).coerceAtLeast(0L)
              }
          }
          KHOAEOF
          mkdir -p app/src/main/java/com/khoamt5/app
          cat > app/src/main/java/com/khoamt5/app/LockService.kt <<'KHOAEOF'
          package com.khoamt5.app

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent

          /**
           * Nghe sự kiện đổi cửa sổ. Chỉ phản ứng khi app vừa hiện lên nằm trong danh sách
           * app bị khóa và đang trong thời gian khóa: đẩy về màn hình chính.
           * Không đọc nội dung màn hình (canRetrieveWindowContent = false).
           */
          class LockService : AccessibilityService() {

              private var lastLaunch = 0L
              private val protectedPkgs by lazy { LockStore.protectedPackages(this) }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg !in LockStore.lockedPackages(this)) return
                  if (pkg in protectedPkgs) return
                  if (LockStore.remainingMs(this) <= 0L) return

                  // Bước chắc chắn: đẩy app ra màn hình chính.
                  performGlobalAction(GLOBAL_ACTION_HOME)

                  // Thêm: mở màn hình đếm ngược của app (có thể bị hệ thống chặn, không sao).
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastLaunch > 1000L) {
                      lastLaunch = now
                      try {
                          val intent = Intent(this, MainActivity::class.java)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          startActivity(intent)
                      } catch (_: Exception) {
                      }
                  }
              }

              override fun onInterrupt() {}
          }
          KHOAEOF
          mkdir -p app/src/main/java/com/khoamt5/app
          cat > app/src/main/java/com/khoamt5/app/MainActivity.kt <<'KHOAEOF'
          package com.khoamt5.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val handler = Handler(Looper.getMainLooper())

              private lateinit var title: TextView
              private lateinit var countdown: TextView
              private lateinit var appsText: TextView
              private lateinit var selectBtn: Button
              private lateinit var durationRow: LinearLayout
              private lateinit var durationLabel: TextView
              private lateinit var minusBtn: Button
              private lateinit var plusBtn: Button
              private lateinit var lockBtn: Button
              private lateinit var hint: TextView
              private lateinit var permBtn: Button
              private lateinit var infoBtn: Button

              private var summary: String = ""
              private var selectCount: Int = 0

              private val tick = object : Runnable {
                  override fun run() {
                      refresh()
                      handler.postDelayed(this, 500L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUi()
              }

              override fun onResume() {
                  super.onResume()
                  updateSummary()
                  handler.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(tick)
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun roundedBg(color: Int): GradientDrawable = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(24).toFloat()
              }

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(24), dp(24), dp(24), dp(24))
                      setBackgroundColor(Color.parseColor("#12161C"))
                  }

                  title = TextView(this).apply {
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  countdown = TextView(this).apply {
                      textSize = 52f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.MONOSPACE
                      gravity = Gravity.CENTER
                  }
                  appsText = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.parseColor("#7FB2FF"))
                      gravity = Gravity.CENTER
                  }
                  selectBtn = Button(this).apply {
                      isAllCaps = false
                      setOnClickListener { showPicker() }
                  }

                  minusBtn = Button(this).apply {
                      text = "−"
                      textSize = 24f
                      setOnClickListener { changeDuration(-1) }
                  }
                  plusBtn = Button(this).apply {
                      text = "+"
                      textSize = 24f
                      setOnClickListener { changeDuration(+1) }
                  }
                  durationLabel = TextView(this).apply {
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  durationRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(minusBtn, LinearLayout.LayoutParams(dp(72), dp(56)))
                      addView(durationLabel, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      addView(plusBtn, LinearLayout.LayoutParams(dp(72), dp(56)))
                  }

                  lockBtn = Button(this).apply {
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      isAllCaps = false
                      setOnClickListener { onLockClicked() }
                  }
                  hint = TextView(this).apply {
                      textSize = 14f
                      setTextColor(Color.parseColor("#9AA4B2"))
                      gravity = Gravity.CENTER
                  }
                  permBtn = Button(this).apply {
                      text = "Bật quyền Trợ năng"
                      isAllCaps = false
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  infoBtn = Button(this).apply {
                      text = "Mở thông tin ứng dụng (nếu công tắc bị mờ)"
                      isAllCaps = false
                      setOnClickListener {
                          startActivity(
                              Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                                  .setData(Uri.parse("package:$packageName"))
                          )
                      }
                  }

                  fun lp(top: Int, height: Int = LinearLayout.LayoutParams.WRAP_CONTENT) =
                      LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, height)
                          .apply { topMargin = dp(top) }

                  root.addView(title, lp(0))
                  root.addView(countdown, lp(8))
                  root.addView(appsText, lp(8))
                  root.addView(selectBtn, lp(12))
                  root.addView(durationRow, lp(12))
                  root.addView(lockBtn, lp(16, dp(100)))
                  root.addView(hint, lp(20))
                  root.addView(permBtn, lp(24))
                  root.addView(infoBtn, lp(8))

                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(Color.parseColor("#12161C"))
                      addView(
                          root,
                          FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.WRAP_CONTENT
                          )
                      )
                  }
                  setContentView(scroll)
              }

              private fun appLabel(pkg: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
              } catch (_: Exception) {
                  pkg
              }

              /** Tính lại chuỗi tóm tắt app đã chọn (không làm mỗi 500ms cho nhẹ). */
              private fun updateSummary() {
                  val names = LockStore.lockedPackages(this).map { appLabel(it) }.sorted()
                  selectCount = names.size
                  summary = when {
                      names.isEmpty() -> "chưa chọn app nào"
                      names.size <= 3 -> names.joinToString(", ")
                      else -> names.take(3).joinToString(", ") + " và ${names.size - 3} app khác"
                  }
              }

              private fun showPicker() {
                  if (LockStore.remainingMs(this) > 0L) return
                  val pm = packageManager
                  val protectedPkgs = LockStore.protectedPackages(this)
                  val current = LockStore.lockedPackages(this)

                  val launcherIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(launcherIntent, 0)
                      .map { it.activityInfo.packageName to it.loadLabel(pm).toString() }
                      .distinctBy { it.first }
                      .filter { it.first !in protectedPkgs }
                      .sortedWith(
                          compareByDescending<Pair<String, String>> { it.first in current }
                              .thenBy { it.second.lowercase() }
                      )

                  if (apps.isEmpty()) {
                      Toast.makeText(this, "Không tìm thấy app nào để chọn", Toast.LENGTH_LONG).show()
                      return
                  }

                  val labels = apps.map { it.second }.toTypedArray<CharSequence>()
                  val checked = BooleanArray(apps.size) { apps[it].first in current }
                  val chosen = current.toMutableSet()
                  val inList = apps.map { it.first }.toSet()

                  AlertDialog.Builder(this)
                      .setTitle("Chọn app cần khóa")
                      .setMultiChoiceItems(labels, checked) { _, which, isChecked ->
                          val p = apps[which].first
                          if (isChecked) chosen.add(p) else chosen.remove(p)
                      }
                      .setPositiveButton("Lưu") { _, _ ->
                          LockStore.setLockedPackages(this, chosen.filter { it in inList }.toSet())
                          updateSummary()
                          refresh()
                      }
                      .setNegativeButton("Hủy", null)
                      .show()
              }

              private fun changeDuration(delta: Int) {
                  if (LockStore.remainingMs(this) > 0L) return
                  LockStore.setSelectedIndex(this, LockStore.selectedIndex(this) + delta)
                  refresh()
              }

              private fun onLockClicked() {
                  if (!isServiceEnabled()) {
                      Toast.makeText(this, "Hãy bật quyền Trợ năng cho Khóa App trước", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  if (selectCount == 0) {
                      Toast.makeText(this, "Hãy chọn ít nhất 1 app cần khóa", Toast.LENGTH_LONG).show()
                      return
                  }
                  val minutes = LockStore.STEPS_MIN[LockStore.selectedIndex(this)]
                  if (minutes >= 60L) {
                      // Khóa dài thì hỏi lại một lần cho khỏi bấm nhầm.
                      AlertDialog.Builder(this)
                          .setTitle("Khóa ${LockStore.label(minutes)}?")
                          .setMessage(
                              "App bị khóa: $summary.\n\n" +
                                  "Bắt đầu rồi thì không dừng được cho tới khi hết giờ. " +
                                  "Lệnh MT5 đang mở vẫn chạy, hãy chắc chắn đã đặt SL."
                          )
                          .setPositiveButton("Khóa") { _, _ -> doLock(minutes) }
                          .setNegativeButton("Hủy", null)
                          .show()
                  } else {
                      doLock(minutes)
                  }
              }

              private fun doLock(minutes: Long) {
                  LockStore.start(this, minutes)
                  refresh()
              }

              private fun formatMs(ms: Long): String {
                  val s = (ms + 999L) / 1000L
                  val h = s / 3600L
                  val m = (s % 3600L) / 60L
                  val sec = s % 60L
                  return if (h > 0L) String.format("%d:%02d:%02d", h, m, sec)
                  else String.format("%02d:%02d", m, sec)
              }

              private fun refresh() {
                  val remaining = LockStore.remainingMs(this)
                  val enabled = isServiceEnabled()

                  val showSetup = if (enabled) View.GONE else View.VISIBLE
                  permBtn.visibility = showSetup
                  infoBtn.visibility = showSetup

                  appsText.text = "App bị khóa: $summary"

                  if (remaining > 0L) {
                      title.text = "ĐANG KHÓA"
                      countdown.text = formatMs(remaining)
                      selectBtn.visibility = View.GONE
                      durationRow.visibility = View.GONE
                      lockBtn.isEnabled = false
                      lockBtn.text = "Đang khóa..."
                      lockBtn.background = roundedBg(Color.parseColor("#3A4250"))
                      hint.text = "Hết giờ sẽ tự mở khóa. Không có nút dừng."
                  } else {
                      val idx = LockStore.selectedIndex(this)
                      val minutes = LockStore.STEPS_MIN[idx]
                      title.text = "Khóa App"
                      countdown.text = formatMs(minutes * 60_000L)
                      selectBtn.visibility = View.VISIBLE
                      selectBtn.text = "Chọn app cần khóa ($selectCount)"
                      durationRow.visibility = View.VISIBLE
                      durationLabel.text = LockStore.label(minutes)
                      minusBtn.isEnabled = idx > 0
                      plusBtn.isEnabled = idx < LockStore.STEPS_MIN.size - 1
                      lockBtn.isEnabled = true
                      lockBtn.text = "KHÓA ${LockStore.label(minutes).uppercase()}"
                      lockBtn.background = roundedBg(Color.parseColor("#D93636"))
                      hint.text = if (enabled) {
                          "Chọn app và thời gian, rồi bấm khóa. Lệnh MT5 đang mở vẫn chạy, nhớ đặt SL."
                      } else {
                          "Cần bật quyền Trợ năng cho Khóa App thì mới chặn được. " +
                              "Nếu công tắc bị mờ: Thông tin ứng dụng → dấu ⋮ → Cho phép cài đặt bị hạn chế."
                      }
                  }
              }

              private fun isServiceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val cn = ComponentName(this, LockService::class.java)
                  val full = cn.flattenToString()
                  val short = cn.flattenToShortString()
                  return enabled.split(':').any { it.equals(full, true) || it.equals(short, true) }
              }
          }
          KHOAEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KhoaMT5-apk
          path: app/build/outputs/apk/debug/app-debug.apk
